name: Update Free Idol Events

on:
  schedule:
    # 毎日 日本時間 07:00 (UTC 22:00) と 19:00 (UTC 10:00) に自動実行
    - cron: '0 22,10 * * *'
  workflow_dispatch: # GitHubの管理画面から手動実行可能

permissions:
  contents: write # コミット＆プッシュ用の書き込み権限

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: イベント情報スクレイピングを実行
        run: |
          python run_scraper.py --max-items 40

      - name: 差分がある場合にコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/ docs/ README.md
          
          # 変更があるか確認
          if git diff --staged --quiet; then
            echo "変更はありませんでした。コミットをスキップします。"
          else
            git commit -m "chore(auto): update free idol events [skip ci] ($(date +'%Y-%m-%d %H:%M'))"
            git push origin HEAD:${{ github.ref_name }}
            echo "最新のイベント情報をコミット＆プッシュしました。"
          fi
